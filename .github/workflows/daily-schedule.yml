name: Post daily schedule to GroupMe

on:
  schedule:
    # 14:00 UTC = 10 AM EDT / 9 AM EST. Mon-Thu posts that night's schedule;
    # Tue-Fri nudges about the previous night's missing scores. Both scripts
    # exit quietly on days that don't apply.
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Schedule date override (YYYY-MM-DD, ET)'
        required: false
      results_date:
        description: 'Missing-scores game-night override (YYYY-MM-DD, ET; default yesterday)'
        required: false
      dry_run:
        description: 'Print the message instead of posting'
        type: boolean
        default: false
      test:
        description: 'Post to the Bot Test Group instead of real chats'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Post schedule
        env:
          # Access token posts into the night's topic; bot ID is the
          # main-chat fallback (bots can't post to topics).
          GROUPME_TOKEN: ${{ secrets.GROUPME_TOKEN }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          GROUPME_BOT_ID_TEST: ${{ secrets.GROUPME_BOT_ID_TEST }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date=${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --test"; fi
          node scripts/post-daily-schedule.mjs $ARGS
      - name: Nudge about missing scores
        # Runs even if the schedule post failed; the nudge is independent.
        if: ${{ !cancelled() }}
        env:
          GROUPME_TOKEN: ${{ secrets.GROUPME_TOKEN }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          GROUPME_BOT_ID_TEST: ${{ secrets.GROUPME_BOT_ID_TEST }}
        run: |
          # SHAKEDOWN: nudges are pinned to the Bot Test Group until validated
          # against real Summer Redux scores. Remove the hardcoded --test below
          # to go live in the real night topics.
          ARGS="--test"
          if [ -n "${{ inputs.results_date }}" ]; then ARGS="$ARGS --date=${{ inputs.results_date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/post-missing-scores.mjs $ARGS
