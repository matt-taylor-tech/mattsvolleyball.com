name: Shuffle RSVP check

on:
  schedule:
    # 19:00 UTC = 3 PM EDT / 2 PM EST, Wednesdays. Reads the day's shuffle
    # event RSVP count and posts a nudge or confirmation to the group.
    - cron: '0 19 * * 3'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD, ET)'
        required: false
      dry_run:
        description: 'Print the message instead of posting'
        type: boolean
        default: false
      test:
        description: 'Use the Bot Test Group instead of the real group'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check RSVPs
        env:
          GROUPME_TOKEN: ${{ secrets.GROUPME_TOKEN }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          GROUPME_BOT_ID_TEST: ${{ secrets.GROUPME_BOT_ID_TEST }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date=${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --test"; fi
          node scripts/check-shuffle-rsvp.mjs $ARGS
