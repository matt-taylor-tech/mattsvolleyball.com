name: Registration status

on:
  schedule:
    # 15:00 UTC = 11 AM EDT / 10 AM EST, daily. Posts only while a
    # registration window is open AND the counts changed since last post.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip the registration-window gate'
        type: boolean
        default: false
      dry_run:
        description: 'Print instead of posting'
        type: boolean
        default: false
      test:
        description: 'Post to the Bot Test Group instead of the main group'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post registration status
        env:
          GROUPME_TOKEN: ${{ secrets.GROUPME_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --test"; fi
          node scripts/post-registration-status.mjs $ARGS
