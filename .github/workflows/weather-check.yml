name: Game-day weather check

on:
  schedule:
    # 18:15 UTC = 2:15 PM EDT, Mon-Thu; with GitHub cron lag this lands
    # comfortably before the 4 PM rainout call the message references. Posts
    # only when the NWS forecast shows rain or storms during the game window
    # on a game day.
    - cron: '15 18 * * 1-4'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD, ET)'
        required: false
      dry_run:
        description: 'Print instead of posting'
        type: boolean
        default: false
      test:
        description: 'Post to the Bot Test Group instead of the night conversation'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check forecast
        env:
          GROUPME_TOKEN: ${{ secrets.GROUPME_TOKEN }}
          GROUPME_BOT_ID_TEST: ${{ secrets.GROUPME_BOT_ID_TEST }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date=${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --test"; fi
          node scripts/check-weather.mjs $ARGS
