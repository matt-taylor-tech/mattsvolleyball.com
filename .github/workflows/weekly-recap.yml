name: Post weekly recap to GroupMe

on:
  schedule:
    # 15:15 UTC = 11:15 AM EDT, Mondays; with GitHub cron lag this lands by
    # ~noon. Each night's topic gets "what happened last week": results +
    # standings per division.
    - cron: '15 15 * * 1'
  workflow_dispatch:
    inputs:
      day:
        description: 'Single night only (Mon/Tue/Wed/Thu; default all)'
        required: false
      date:
        description: 'Game night override (YYYY-MM-DD, ET)'
        required: false
      dry_run:
        description: 'Print the messages instead of posting'
        type: boolean
        default: false
      test:
        description: 'Post to the Bot Test Group instead of real chats'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post weekly recap
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DAY: ${{ inputs.day }}
          GROUPME_TOKEN: ${{ secrets.GROUPME_TOKEN }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          GROUPME_BOT_ID_TEST: ${{ secrets.GROUPME_BOT_ID_TEST }}
        run: |
          ARGS=""
          if [ -n "$INPUT_DAY" ]; then ARGS="$ARGS --day=$INPUT_DAY"; fi
          if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date=$INPUT_DATE"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --test"; fi
          node scripts/post-results.mjs $ARGS
